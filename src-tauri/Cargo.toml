[package]
name = "thoughttree"
version = "0.1.6"
description = "Local-first Thinking Tracker"
authors = ["ThoughtTree"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "thoughttree_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }

# UI Automation (browser address bar) + ShellExecuteW, Windows only. Pinned to
# the 0.62 line that is already in Cargo.lock so no duplicate crate is pulled in.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
